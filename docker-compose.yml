# Servicios locales de desarrollo. No reproducen producción: reproducen las
# versiones contra las que se programa.
#
# NOTA sobre Elasticsearch: se fija 7.10.2 OSS porque es la última distribución
# Apache 2.0 de la rama 7, que es lo que hay en Infonif (ver incógnita 1 en
# CLAUDE.md). No usar imágenes >= 7.14: el cliente oficial las exige y nosotros
# hablamos por fetch justamente para no depender de eso.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    container_name: nia-elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es-datos:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nia-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: nia-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Nia_Local_2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-datos:/var/opt/mssql

volumes:
  es-datos:
  redis-datos:
  mssql-datos:
