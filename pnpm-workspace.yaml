packages:
  - "packages/*"
  - "demo"

# esbuild necesita su script de instalación para dejar el binario de la
# plataforma en su sitio. Lo usan Vite, Vitest, tsx y tsup.
allowBuilds:
  esbuild: true
  # El motor de embeddings local: necesita bajar su binario nativo.
  onnxruntime-node: true
  protobufjs: true
  # No lo usamos: solo entra por el soporte de imágenes de transformers.
  sharp: false
